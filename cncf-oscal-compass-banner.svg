<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 160" width="760" height="160">
  <defs>
    <style>
      text, tspan {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        font-size: 11.5px;
      }

      /* light (default) */
      .bg         { fill: #ffffff; }
      .divider    { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .body       { fill: #1f2328; }
      .muted      { fill: #57606a; }
      .logo-color { display: inline; }
      .logo-white { display: none; }

      /* dark */
      @media (prefers-color-scheme: dark) {
        .bg         { fill: #0d1117; }
        .divider    { stroke: #30363d; }
        .body       { fill: #e6edf3; }
        .muted      { fill: #8b949e; }
        .logo-color { display: none; }
        .logo-white { display: inline; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="760" height="160" rx="6" class="bg"/>
  <line x1="20" y1="24" x2="740" y2="24" class="divider"/>

  <!-- CNCF logo (light / dark variants) -->
  <image class="logo-color" href="https://www.cncf.io/wp-content/uploads/2022/07/cncf-color-bg.svg"   x="20" y="32" width="300" height="52"/>
  <image class="logo-white" href="https://www.cncf.io/wp-content/uploads/2022/07/cncf-white-logo.svg" x="20" y="32" width="300" height="52"/>

  <!-- sandbox statement -->
  <text x="20" y="96" class="body">We are a <tspan font-weight="600">Cloud Native Computing Foundation</tspan> sandbox project.</text>

  <!-- TLF trademark line -->
  <text x="20" y="114" class="muted" font-size="11">The Linux Foundation® (TLF) has registered trademarks and uses trademarks. For a list of TLF trademarks, see <tspan><a xlink:href="https://www.linuxfoundation.org/legal/trademark-usage" style="fill:#0969da;">Trademark Usage</a></tspan>.</text>

  <!-- independence notice -->
  <text x="20" y="132" class="muted" font-size="10.5" font-style="italic">OSCAL Compass is an independent open source project. It is not affiliated with, endorsed by, or sponsored by the National Institute of Standards and Technology (NIST) or any other government agency.</text>

  <!-- IBM attribution -->
  <text x="20" y="150" class="muted" font-size="10.5" font-style="italic">OSCAL Compass was originally contributed by IBM.</text>
</svg>